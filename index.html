<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#11151C" />
<meta name="description" content="Ledger — a private trading journal: dashboard performance, daily reflections and a journal for every single trade." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Ledger — Trading Journal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%20role%3D%22img%22%20aria-label%3D%22Ledger%22%3E%0A%09%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22120%22%20fill%3D%22%2319212E%22/%3E%0A%09%3Crect%20x%3D%22144%22%20y%3D%22176%22%20width%3D%2264%22%20height%3D%22192%22%20rx%3D%2224%22%20fill%3D%22%2372BC8F%22/%3E%0A%09%3Crect%20x%3D%22168%22%20y%3D%22120%22%20width%3D%2216%22%20height%3D%22288%22%20rx%3D%228%22%20fill%3D%22%2372BC8F%22/%3E%0A%09%3Crect%20x%3D%22304%22%20y%3D%22144%22%20width%3D%2264%22%20height%3D%22144%22%20rx%3D%2224%22%20fill%3D%22%235E9FE8%22/%3E%0A%09%3Crect%20x%3D%22328%22%20y%3D%2296%22%20width%3D%2216%22%20height%3D%22288%22%20rx%3D%228%22%20fill%3D%22%235E9FE8%22/%3E%0A%3C/svg%3E%0A" type="image/svg+xml" />
<style>
:root{
  --bg:#11151C; --s1:#151B25; --s2:#19212E; --s3:#212D40; --line:#273246; --line2:#2C374B; --raise:#313C51; --soft:#485265;
  --txt:#FFFFFF; --txt2:rgba(255,255,255,.66); --txt3:rgba(255,255,255,.44);
  --blue:#5E9FE8; --green:#72BC8F; --red:#E97366; --orange:#DE9255; --violet:#BF8EDA;
  --blue-t:rgba(94,159,232,.12); --green-t:rgba(114,188,143,.12); --red-t:rgba(233,115,102,.12); --orange-t:rgba(222,146,85,.12);
  --r:12px; --rs:8px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:Menlo,Consolas,"SF Mono",monospace;
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 8px 24px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
::selection{background:rgba(94,159,232,.3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.sidebar{
  border-right:1px solid var(--line); background:var(--s1); padding:20px 16px;
  display:flex; flex-direction:column; gap:24px; position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.brand-name{font-size:16px;font-weight:650;letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--txt3);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--rs);
  background:transparent;color:var(--txt2);cursor:pointer;font-size:14.5px;text-align:left;
}
.nav-btn:hover{background:var(--s3);color:var(--txt)}
.nav-btn[aria-current="true"]{background:var(--s3);color:var(--txt);font-weight:550}
.nav-btn svg{flex:none;opacity:.9}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.acct{display:flex;align-items:center;gap:10px;padding:10px;background:var(--s2);border:1px solid var(--line);border-radius:var(--rs)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--s3);border:1px solid var(--line2);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--txt2);flex:none}
.acct-name{font-size:13.5px;font-weight:550;line-height:1.25}
.acct-mode{font-size:11.5px;color:var(--txt3)}

main{min-width:0;padding:26px 32px 96px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-title{font-size:26px;font-weight:640;letter-spacing:-.02em;margin:0}
.page-sub{margin:4px 0 0;color:var(--txt3);font-size:13.5px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;
  border-radius:var(--rs);border:1px solid var(--line2);background:var(--s2);color:var(--txt);
  cursor:pointer;font-size:14px;font-weight:520;white-space:nowrap;
}
.btn:hover{background:var(--raise)}
.btn-primary{background:var(--blue);border-color:transparent;color:#0C1220;font-weight:600}
.btn-primary:hover{background:#78AFEC}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-ghost:hover{background:var(--s2)}
.btn-danger{color:var(--red);border-color:rgba(233,115,102,.36);background:transparent}
.btn-danger:hover{background:var(--red-t)}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.icon-btn{width:38px;min-height:38px;padding:0}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.card-note{font-size:12.5px;color:var(--txt3)}
.label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3)}

.grid{display:grid;gap:14px}
.stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.stat-v{font-size:25px;font-weight:640;letter-spacing:-.025em;margin-top:7px;font-variant-numeric:tabular-nums}
.stat-m{font-size:12.5px;color:var(--txt3);margin-top:5px}
.pos{color:var(--green)} .neg{color:var(--red)} .neu{color:var(--txt)}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.chip-long{background:var(--green-t);color:var(--green)}
.chip-short{background:var(--red-t);color:var(--red)}
.chip-win{background:var(--green-t);color:var(--green)}
.chip-loss{background:var(--red-t);color:var(--red)}
.chip-be{background:var(--blue-t);color:var(--blue)}
.chip-flat{background:rgba(255,255,255,.07);color:var(--txt2)}

input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],select,textarea{
  width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:var(--rs);
  padding:9px 11px;min-height:40px;color:var(--txt);
}
textarea{min-height:84px;resize:vertical;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--txt3)}
input:hover,textarea:hover,select:hover{border-color:var(--raise)}
.field{display:flex;flex-direction:column;gap:6px}
.field > .label{margin-bottom:1px}
.hint{font-size:12px;color:var(--txt3)}
code{font-family:var(--mono);font-size:12.5px;background:var(--s2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--txt2)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.seg{display:inline-flex;align-self:flex-start;background:var(--s2);border:1px solid var(--line2);border-radius:var(--rs);padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--txt2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13.5px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--txt);font-weight:600}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--txt3);font-size:11px}
.axis-line{stroke:var(--line);stroke-width:1}
.grid-line{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;opacity:.7}

/* ---------- lists ---------- */
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{
  display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;
  background:var(--s1);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;
  cursor:pointer;text-align:left;width:100%;
}
.trow:hover{background:var(--s2);border-color:var(--line2)}
.trow .d{font-size:12.5px;color:var(--txt3);font-variant-numeric:tabular-nums}
.trow .pair{font-size:15px;font-weight:600;letter-spacing:-.01em}
.trow .meta{font-size:12.5px;color:var(--txt3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .pnl{display:block;font-size:16px;font-weight:640;text-align:right;font-variant-numeric:tabular-nums}
.trow .rr{display:block;font-size:12px;color:var(--txt3);text-align:right;margin-top:2px}
.daygroup{margin-top:18px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 2px 8px}
.dayhead h3{margin:0;font-size:13.5px;font-weight:600;color:var(--txt2)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--txt3);font-size:14px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{text-align:right;padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{color:var(--txt3);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}

/* ---------- q blocks ---------- */
.qcard{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.qtext{font-size:14.5px;font-weight:560;letter-spacing:-.005em}
.qnum{width:22px;height:22px;border-radius:6px;background:var(--blue-t);color:var(--blue);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.qhead{display:flex;gap:10px;align-items:center}
.saved{font-size:12px;color:var(--green);display:flex;align-items:center;gap:5px}

/* ---------- drop zones ---------- */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{
  border:1px dashed var(--line2);border-radius:var(--rs);background:var(--s2);
  min-height:132px;display:grid;place-items:center;text-align:center;padding:12px;cursor:pointer;position:relative;overflow:hidden;
}
.drop:hover,.drop.over{border-color:var(--blue);background:rgba(94,159,232,.06)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .dz-t{display:block;font-size:13px;color:var(--txt2)}
.drop .dz-s{display:block;font-size:11.5px;color:var(--txt3);margin-top:3px}
.shot-tag{position:absolute;left:8px;top:8px;background:rgba(17,21,28,.82);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;z-index:2}
.shot-x{position:absolute;right:6px;top:6px;z-index:2;width:26px;height:26px;min-height:26px;padding:0;border-radius:6px;background:rgba(17,21,28,.86)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,11,16,.66);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px}
.modal{
  background:var(--s1);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);
  width:100%;max-width:620px;max-height:88vh;overflow:auto;
}
.modal-head{position:sticky;top:0;background:var(--s1);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
.modal-head h2{margin:0;font-size:17px;font-weight:640;letter-spacing:-.015em}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal-foot{position:sticky;bottom:0;background:var(--s1);border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:flex-end;gap:8px}

/* ---------- ai ---------- */
.ai-fab{position:fixed;right:24px;bottom:24px;z-index:50;height:46px;border-radius:999px;padding:0 16px;box-shadow:var(--shadow)}
.ai-panel{position:fixed;right:24px;bottom:24px;width:380px;max-width:calc(100vw - 32px);max-height:min(560px,80vh);z-index:55;
  background:var(--s1);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ai-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ai-log{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;flex:1;min-height:150px}
.bub{padding:10px 12px;border-radius:10px;font-size:14px;max-width:88%;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--s3);border:1px solid var(--line2)}
.bub.ai{align-self:flex-start;background:var(--s2);border:1px solid var(--line)}
.ai-in{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end}
.ai-in textarea{min-height:40px;max-height:110px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.sugg button{font-size:12.5px;min-height:30px;padding:0 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--txt2);cursor:pointer}
.sugg button:hover{color:var(--txt);background:var(--s3)}

/* ---------- toast + tabbar ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:80;background:var(--s3);border:1px solid var(--line2);
  border-radius:999px;padding:9px 16px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,bottom .18s}
.toast.on{opacity:1;bottom:96px}
.tabbar{display:none}

/* ---------- signin ---------- */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px}
.signin-card{width:100%;max-width:392px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow)}
.signin h1{font-size:21px;margin:14px 0 6px;letter-spacing:-.02em}
.signin p.sub{margin:0 0 20px;color:var(--txt3);font-size:13.5px}
.divider{display:flex;align-items:center;gap:10px;color:var(--txt3);font-size:12px;margin:16px 0}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}

/* ---------- responsive ---------- */
@media (max-width:1080px){ .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  main{padding:18px 18px calc(124px + env(safe-area-inset-bottom))}
  .page-title{font-size:22px}
  .row-2,.row-3{grid-template-columns:1fr}
  /* inline grid templates on the dashboard/settings rows must collapse on phones */
  .grid{grid-template-columns:1fr!important;align-items:stretch!important}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .chart{min-height:200px}
  .card{min-width:0}
  .table-wrap{min-width:0;max-width:100%}
  table{min-width:0}
  th,td{padding-left:8px;padding-right:8px}
  .shots{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr auto;gap:10px}
  .trow .d{display:none}
  .tabbar{
    display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:rgba(21,27,37,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{background:transparent;border:0;color:var(--txt3);display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 0;min-height:52px;font-size:11px;cursor:pointer;border-radius:var(--rs)}
  .tabbar button[aria-current="true"]{color:var(--blue)}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .ai-panel{right:8px;left:8px;bottom:76px;width:auto;max-height:70vh}
}
@media (min-width:861px){ .mobile-top{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   Ledger — Trading Journal System
   Single-file web app. Data layer is pluggable:
     - default: localStorage (works offline, no setup)
     - optional: Firebase (Auth + Firestore) — see CLOUD block below
   ===================================================================== */

/* ---------------------------------------------------------------------
   CLOUD / FIREBASE HOOK
   assets/firebase.js pulls the public Firebase config from /api/config
   (populated by .env.local locally, or Vercel env vars in production).
   When the config is filled in it sets
     window.LEDGER_CLOUD = { signIn, signUp, signOut, load, save, onUser }
   and fires the "ledger-cloud-ready" event.
   With no config the app just stays in offline localStorage mode.
--------------------------------------------------------------------- */
const Cloud = () => (window.LEDGER_CLOUD || null);

/* ---------------------------- state ---------------------------- */
const KEY = "ledger.v1";
const DEFAULT_STATE = {
  session: { mode: "local", email: "", name: "Guest trader" },
  settings: { currency: "USD", startBalance: 5000, aiMode: "proxy", aiKey: "", aiModel: "gpt-4o-mini" },
  trades: [],
  journals: {},   // "YYYY-MM-DD" -> { q1,q2,q3, updatedAt }
  seeded: false
};
let state = load();
let route = location.hash.replace("#","") || "dashboard";
let ui = { month: null, aiOpen:false, aiLog:[], aiBusy:false, editing:null, sort:"new" };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return seed(structuredClone(DEFAULT_STATE));
    const s = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT_STATE), s);
  }catch(e){ return seed(structuredClone(DEFAULT_STATE)); }
}
let saveTimer=null;
function save(quiet){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("Storage full — remove some screenshots"); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ const c=Cloud(); if(c && state.session.mode==="cloud") c.save(state); }, 900);
  if(!quiet) flashSaved();
}

/* ---------------------------- helpers ---------------------------- */
const CUR = { USD:"$", EUR:"€", PHP:"₱", GBP:"£", JPY:"¥" };
const sym = () => CUR[state.settings.currency] || "$";
const nf = (n,d=2) => Number(n||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
function money(n,opts={}){
  const v = Number(n||0), s = v>0?"+":v<0?"-":"";
  const body = sym()+nf(Math.abs(v), Math.abs(v)>=1000?0:2);
  return (opts.signed===false? "" : s) + body;
}
const cls = n => Number(n)>0?"pos":Number(n)<0?"neg":"neu";
const pct = n => (Number(n)||0).toFixed(1)+"%";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => new Date().toLocaleDateString("en-CA");
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dLabel(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return MON[m-1]+" "+d+", "+y;
}
function dShort(iso){ const [y,m,d]=iso.split("-").map(Number); return MON[m-1]+" "+d; }
function weekday(iso){ const dt=new Date(iso+"T00:00:00"); return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dt.getDay()]; }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2100);
}
function flashSaved(){
  document.querySelectorAll("[data-saved]").forEach(el=>{
    el.innerHTML = ICON.check+" Saved";
    clearTimeout(el._t); el._t=setTimeout(()=>{ el.innerHTML=""; }, 1600);
  });
}

/* ---------------------------- icons ---------------------------- */
const I = (p,extra="") => '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" '+extra+'>'+p+'</svg>';

/* ---------------------------- stats ---------------------------- */
function stats(list){
  const t = list.slice();
  const wins = t.filter(x=>x.pnl>0), losses = t.filter(x=>x.pnl<0), be = t.filter(x=>x.pnl===0);
  const gp = wins.reduce((a,b)=>a+b.pnl,0), gl = Math.abs(losses.reduce((a,b)=>a+b.pnl,0));
  const net = t.reduce((a,b)=>a+b.pnl,0);
  const avgW = wins.length? gp/wins.length : 0;
  const avgL = losses.length? gl/losses.length : 0;
  const wr = t.length? wins.length/t.length*100 : 0;
  const rs = t.filter(x=>typeof x.rr==="number" && !isNaN(x.rr)).map(x=>x.rr);
  const sorted = t.slice().sort((a,b)=> a.date===b.date ? (a.created||0)-(b.created||0) : a.date.localeCompare(b.date));
  let eq=0, peak=0, dd=0, streak=0, best=0, worst=0, cur=0;
  sorted.forEach(x=>{
    eq+=x.pnl; peak=Math.max(peak,eq); dd=Math.min(dd, eq-peak);
    if(x.pnl>0) cur = cur>0? cur+1 : 1; else if(x.pnl<0) cur = cur<0? cur-1 : -1;
    best=Math.max(best,cur); worst=Math.min(worst,cur);
  });
  streak = cur;
  return {
    n:t.length, wins:wins.length, losses:losses.length, be:be.length, net, gp, gl,
    wr, avgW, avgL,
    pf: gl? gp/gl : (gp? Infinity : 0),
    expectancy: t.length? net/t.length : 0,
    avgR: rs.length? rs.reduce((a,b)=>a+b,0)/rs.length : null,
    bestTrade: t.length? Math.max(...t.map(x=>x.pnl)) : 0,
    worstTrade: t.length? Math.min(...t.map(x=>x.pnl)) : 0,
    maxDD: dd, streak, bestStreak:best, worstStreak:worst,
    equity: sorted.reduce((acc,x)=>{ const last = acc.length? acc[acc.length-1].v : 0; acc.push({date:x.date, v:last+x.pnl}); return acc; },[])
  };
}
function monthKey(iso){ return iso.slice(0,7); }
function monthsOf(list){
  const set = [...new Set(list.map(t=>monthKey(t.date)))].sort();
  return set;
}
function monthLabel(mk){ const [y,m]=mk.split("-"); return MON[Number(m)-1]+" "+y; }

/* ---------------------------- seed demo ---------------------------- */
function seed(s){
  let x = 20260825;
  const rnd = () => { x = (1103515245*x + 12345) % 2147483648; return x/2147483648; };
  const pairs = ["BTC/USDT","ETH/USDT","SOL/USDT","LINK/USDT","ARB/USDT","DOGE/USDT","AVAX/USDT","SUI/USDT"];
  const setups = ["Range deviation reclaim","HTF trend continuation","Liquidity sweep + FVG","Breakout retest","Failed auction reversal","News momentum"];
  const notesWin = ["Waited for the reclaim candle to close before entering. Size was planned, no add-ons.","Followed the plan: entry at the level, stop under the sweep, target previous high.","Took partials at 1R and let the runner work into the daily level."];
  const notesLoss = ["Entered before confirmation because I was afraid of missing the move.","Widened the stop mid-trade. Broke my own rule.","Traded a low-conviction setup right after a loss — revenge entry."];
  const trades = [];
  const base = new Date("2026-08-25T00:00:00");
  for(let d=0; d<95; d++){
    const day = new Date(base); day.setDate(base.getDate()-d);
    const dow = day.getDay();
    if(dow===0 && rnd()<0.7) continue;
    if(rnd()<0.42) continue;
    const iso = day.toLocaleDateString("en-CA");
    const count = 1 + Math.floor(rnd()*3);
    for(let k=0;k<count;k++){
      const win = rnd() < 0.54;
      const rr = win ? 0.8 + rnd()*2.6 : -(0.6 + rnd()*1.1);
      const risk = 55 + Math.floor(rnd()*70);
      const pnl = Math.round(rr*risk*100)/100;
      const dir = rnd()<0.58 ? "long" : "short";
      const pair = pairs[Math.floor(rnd()*pairs.length)];
      const entry = Math.round((10+rnd()*220)*100)/100;
      const exitP = Math.round((entry * (1 + (dir==="long"?1:-1)*(win?1:-1)*(0.004+rnd()*0.05)))*100)/100;
      trades.push({
        id: uid(), date: iso, created: day.getTime()+k*3600000,
        pair, dir, setup: setups[Math.floor(rnd()*setups.length)],
        entry, exit: exitP, size: Math.round((risk*3)/entry*1000)/1000,
        pnl, rr: Math.round(rr*100)/100, fees: Math.round(rnd()*4*100)/100,
        q1: win ? "The narrative worked because higher-timeframe structure agreed with the intraday level — buyers defended it twice before I entered." 
                : "The narrative failed because I only had the intraday level; higher timeframe was still in a downtrend so the level never held.",
        q2: win ? notesWin[Math.floor(rnd()*notesWin.length)] : notesLoss[Math.floor(rnd()*notesLoss.length)],
        q3: win ? "Repeatable. Next time size a little larger when HTF and LTF agree." : "Wait for the confirmation close and keep the original stop. No re-entry after the first loss.",
        shots: { entry:null, exit:null }
      });
    }
  }
  s.trades = trades;
  const days = [...new Set(trades.map(t=>t.date))].sort().slice(-6);
  days.forEach((iso,i)=>{
    s.journals[iso] = {
      q1: i%2 ? "I over-traded the afternoon session. Two of the entries were not on my plan sheet." : "Nothing structural — I hesitated on the A+ setup and got a worse fill.",
      q2: i%2 ? "Fear of missing the continuation after the London move. I was watching PnL instead of levels." : "They were pre-marked levels from my morning prep, so conviction was genuine.",
      q3: "Cap the day at three trades, journal each one before opening the next, and stop trading after two losses.",
      updatedAt: Date.now()
    };
  });
  s.seeded = true;
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  return s;
}

/* ---------------------------- charts ---------------------------- */
function barChart(rows, opts={}){
  // rows: [{label, value}]
  const W = 640, H = opts.height||210, pl=48, pr=8, pt=12, pb=26;
  if(!rows.length) return '<div class="empty">No closed trades yet</div>';
  const vals = rows.map(r=>Number(r.value)||0);
  let top = Math.max(0, ...vals), bot = Math.min(0, ...vals);
  const pad = ((top-bot)||1)*0.14;
  if(top>0) top += pad;
  if(bot<0) bot -= pad;
  if(top===bot){ top = 1; bot = 0; }
  const span = top-bot;
  const iw = W-pl-pr, ih = H-pt-pb;
  const Y = v => pt + ih*(1-(v-bot)/span);
  const zero = Y(0);
  const bw = Math.min(46, iw/rows.length*0.62);
  let g = "";
  [top, (top+bot)/2, bot].forEach(v=>{
    const y = Y(v);
    g += '<line class="grid-line" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';
    g += '<text x="'+(pl-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+(v>0?"+":v<0?"-":"")+sym()+nf(Math.abs(v),0)+'</text>';
  });
  g += '<line class="axis-line" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+zero.toFixed(1)+'" y2="'+zero.toFixed(1)+'"/>';
  rows.forEach((r,i)=>{
    const cx = pl + iw*((i+0.5)/rows.length);
    const h = Math.abs(Y(r.value)-zero);
    const y = r.value>=0 ? zero-h : zero;
    const c = r.value>=0 ? "#72BC8F" : "#E97366";
    g += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,h).toFixed(1)+'" rx="3" fill="'+c+'" opacity="'+(r.dim?0.45:0.92)+'"><title>'+esc(r.label)+": "+money(r.value)+'</title></rect>';
    g += '<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(r.label)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||"Performance bar chart")+'">'+g+'</svg>';
}
function lineChart(points, opts={}){
  const W=470, H=opts.height||250, pl=52, pr=12, pt=16, pb=26;
  if(points.length<2) return '<div class="empty">Not enough trades to plot an equity curve</div>';
  const vals = points.map(p=>p.v);
  const min = Math.min(0,...vals), max = Math.max(...vals);
  const span = (max-min)||1, iw=W-pl-pr, ih=H-pt-pb;
  const X = i => pl + iw*(i/(points.length-1));
  const Y = v => pt + ih*(1-(v-min)/span);
  let g="";
  [max,(max+min)/2,min].forEach(v=>{
    const y=Y(v);
    g += '<line class="grid-line" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';
    g += '<text x="'+(pl-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+sym()+nf(v,0)+'</text>';
  });
  if(min<0 && max>0) g += '<line class="axis-line" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'"/>';
  const d = points.map((p,i)=> (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area = d+" L"+X(points.length-1).toFixed(1)+" "+Y(min).toFixed(1)+" L"+X(0).toFixed(1)+" "+Y(min).toFixed(1)+" Z";
  const up = vals[vals.length-1] >= 0;
  const col = up? "#5E9FE8" : "#E97366";
  g = '<defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".28"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
    + g + '<path d="'+area+'" fill="url(#eqg)"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/>'
    + '<circle cx="'+X(points.length-1).toFixed(1)+'" cy="'+Y(vals[vals.length-1]).toFixed(1)+'" r="3.4" fill="'+col+'"/>'
    + '<text x="'+pl+'" y="'+(H-6)+'">'+esc(dShort(points[0].date))+'</text>'
    + '<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(dShort(points[points.length-1].date))+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Equity curve">'+g+'</svg>';
}

function aiContext(){
  const a = stats(state.trades);
  const bySetup = {};
  state.trades.forEach(t=>{ const k=t.setup||"Untagged"; (bySetup[k]=bySetup[k]||[]).push(t.pnl); });
  return {
    currency: state.settings.currency,
    allTime: { trades:a.n, net:+a.net.toFixed(2), winRate:+a.wr.toFixed(1), profitFactor: a.pf===Infinity?null:+a.pf.toFixed(2), expectancy:+a.expectancy.toFixed(2), maxDrawdown:+a.maxDD.toFixed(2), avgR: a.avgR },
    setups: Object.entries(bySetup).map(([k,v])=>({ setup:k, trades:v.length, net:+v.reduce((x,y)=>x+y,0).toFixed(2) })),
    recentTrades: state.trades.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,20)
      .map(t=>({ date:t.date, pair:t.pair, dir:t.dir, setup:t.setup, pnl:t.pnl, r:t.rr, why:t.q1, lesson:t.q3 })),
    recentReflections: Object.entries(state.journals).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7)
      .map(([d,j])=>({ date:d, wrong:j.q1, why:j.q2, improve:j.q3 }))
  };
}
async function askAI(text){
  ui.aiLog.push({role:"user",text}); ui.aiBusy=true; render();
  const sys = "You are a disciplined trading-performance coach. Use only the journal data provided. Be concrete, quantitative and short (max 180 words). Point at process errors, not predictions. Never give financial advice or price targets.";
  const body = { model: state.settings.aiModel || "gpt-4o-mini", messages:[
      {role:"system", content: sys},
      {role:"system", content: "JOURNAL DATA:\n"+JSON.stringify(aiContext())},
      ...ui.aiLog.slice(-8).map(m=>({role: m.role==="user"?"user":"assistant", content:m.text}))
  ]};
  try{
    let res, out;
    if(state.settings.aiMode==="direct"){
      if(!state.settings.aiKey) throw new Error("Add your API key in Settings, or switch to the /api/ai proxy.");
      res = await fetch("https://api.openai.com/v1/chat/completions",{ method:"POST",
        headers:{ "Content-Type":"application/json", Authorization:"Bearer "+state.settings.aiKey }, body: JSON.stringify(body) });
    } else {
      res = await fetch("/api/ai",{ method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    }
    if(!res.ok) throw new Error("Assistant endpoint returned "+res.status+". "+(state.settings.aiMode==="proxy"?"Is /api/ai deployed?":"Check your key."));
    const j = await res.json();
    out = j.reply || (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "No response.";
    ui.aiLog.push({role:"ai", text: out.trim()});
  }catch(e){
    ui.aiLog.push({role:"ai", text:"⚠️ "+e.message});
  }
  ui.aiBusy=false; render();
}

/* ---------------------------- events ---------------------------- */
function wire(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{ route=b.dataset.nav; location.hash=route; window.scrollTo(0,0); render(); });
  const ms = document.getElementById("monthSel"); if(ms) ms.onchange = e => { ui.month = e.target.value; render(); };
  const dp = document.getElementById("dayPick"); if(dp) dp.onchange = e => { ui.day = e.target.value; render(); };
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{ ui.sort=b.dataset.sort; render(); });
  document.querySelectorAll("[data-trade]").forEach(b=>b.onclick=()=>{ ui.editing = structuredClone(state.trades.find(t=>t.id===b.dataset.trade)); render(); });

  document.querySelectorAll("[data-journal]").forEach(el=>{
    el.oninput = () => {
      const d = el.dataset.date;
      const j = state.journals[d] = state.journals[d] || {q1:"",q2:"",q3:""};
      j[el.dataset.journal] = el.value; j.updatedAt = Date.now();
      clearTimeout(el._t); el._t = setTimeout(()=>save(), 600);
    };
  });
  document.querySelectorAll("[data-set]").forEach(el=>{
    el.onchange = () => {
      const k = el.dataset.set;
      state.settings[k] = el.type==="number" ? Number(el.value) : el.value;
      save(); render();
    };
  });
  document.querySelectorAll("[data-ai-mode]").forEach(b=>b.onclick=()=>{ state.settings.aiMode=b.dataset.aiMode; save(true); render(); });
  document.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>askAI(b.dataset.ask));

  const af = document.getElementById("aiForm");
  if(af) af.onsubmit = e => { e.preventDefault(); const t=document.getElementById("aiText"); const v=t.value.trim(); if(!v) return; t.value=""; askAI(v); };
  const log = document.getElementById("aiLog"); if(log) log.scrollTop = log.scrollHeight;

  const sf = document.getElementById("signinForm");
  if(sf) sf.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(sf), email = fd.get("email");
    const c = Cloud();
    if(c){ try{ const u = await c.signIn(email, fd.get("password")); state.session={mode:"cloud",email:u.email,name:u.displayName||email.split("@")[0]};
            const remote = await c.load(); if(remote){ state.trades=remote.trades||state.trades; state.journals=remote.journals||state.journals; } }
          catch(err){ toast(err.message||"Sign-in failed"); return; } }
    else { state.session = {mode:"local", email, name:String(email).split("@")[0]}; toast("Firebase not configured — running locally"); }
    save(true); route="dashboard"; location.hash=route; render();
  };

  document.querySelectorAll("[data-drop]").forEach(z=>{
    const kind = z.dataset.drop;
    const pick = () => {
      const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*";
      inp.onchange = () => inp.files[0] && addShot(kind, inp.files[0]);
      inp.click();
    };
    z.onclick = e => { if(e.target.closest('[data-act="rm-shot"]')) return; pick(); };
    z.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } };
    z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
    z.ondragleave = () => z.classList.remove("over");
    z.ondrop = e => { e.preventDefault(); z.classList.remove("over"); const f=e.dataTransfer.files[0]; if(f) addShot(kind,f); };
  });

  document.querySelectorAll("[data-act]").forEach(b=>{ b.onclick = e => act(b.dataset.act, b, e); });
  document.querySelectorAll("[data-close]").forEach(el=>{
    el.onclick = e => { if(e.target!==el) return; ui.editing=null; render(); };
  });
}

function act(a, el, ev){
  if(ev) ev.preventDefault();
  switch(a){
    case "new-trade": ui.editing = { date: ui.day || todayISO(), dir:"long", shots:{entry:null,exit:null} }; render(); break;
    case "ai-open": ui.aiOpen=true; render(); break;
    case "ai-close": ui.aiOpen=false; render(); break;
    case "goto-signin": route="signin"; location.hash=route; render(); break;
    case "local-mode": state.session={mode:"local",email:"",name:"Guest trader"}; save(true); route="dashboard"; location.hash=route; render(); break;
    case "signout": { const c=Cloud(); if(c) c.signOut(); state.session={mode:"local",email:"",name:"Guest trader"}; save(true); render(); toast("Signed out"); break; }
    case "calc-pnl": {
      const f = document.getElementById("tradeForm"); if(!f) break;
      const en=+f.entry.value, ex=+f.exit.value, sz=+f.size.value, dir=f.dir.value;
      if(!en||!ex||!sz){ toast("Fill entry, exit and size first"); break; }
      const pnl = (dir==="long" ? (ex-en) : (en-ex)) * sz - (+f.fees.value||0);
      f.pnl.value = Math.round(pnl*100)/100; toast("P&L calculated"); break;
    }
    case "rm-shot": { const k=el.dataset.kind; ui.editing.shots[k]=null; render(); break; }
    case "save-trade": saveTrade(); break;
    case "delete-trade": {
      if(!confirm("Delete this trade permanently?")) break;
      state.trades = state.trades.filter(t=>t.id!==ui.editing.id); ui.editing=null; save(true); render(); toast("Trade deleted"); break;
    }
    case "export": {
      const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      const url = URL.createObjectURL(blob), a2=document.createElement("a");
      a2.href=url; a2.download="ledger-backup-"+todayISO()+".json"; a2.click(); URL.revokeObjectURL(url); break;
    }
    case "wipe": {
      if(!confirm("This clears every trade, journal entry and screenshot on this device. Continue?")) break;
      localStorage.removeItem(KEY); state = structuredClone(DEFAULT_STATE); state.seeded=true; save(true); render(); toast("All data cleared"); break;
    }
  }
}

function saveTrade(){
  const f = document.getElementById("tradeForm"); if(!f) return;
  if(!f.pair.value.trim() || f.pnl.value===""){ toast("Pair and P&L are required"); return; }
  const t = ui.editing;
  const rec = {
    id: t.id || uid(),
    created: t.created || Date.now(),
    date: f.date.value || todayISO(),
    pair: f.pair.value.trim().toUpperCase(),
    dir: f.dir.value,
    setup: f.setup.value.trim(),
    entry: f.entry.value===""?null:+f.entry.value,
    exit: f.exit.value===""?null:+f.exit.value,
    size: f.size.value===""?null:+f.size.value,
    pnl: +f.pnl.value,
    rr: f.rr.value===""?null:+f.rr.value,
    fees: f.fees.value===""?null:+f.fees.value,
    q1: f.q1.value, q2: f.q2.value, q3: f.q3.value,
    shots: t.shots || {entry:null,exit:null}
  };
  const i = state.trades.findIndex(x=>x.id===rec.id);
  if(i>=0) state.trades[i]=rec; else state.trades.push(rec);
  ui.day = rec.date; ui.month = monthKey(rec.date); ui.editing=null;
  save(true); render(); toast(i>=0?"Trade updated":"Trade logged");
}

function addShot(kind, file){
  if(!file.type.startsWith("image/")){ toast("Images only"); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1200, sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      ui.editing.shots = ui.editing.shots || {entry:null,exit:null};
      ui.editing.shots[kind] = c.toDataURL("image/jpeg", 0.72);
      render();
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* paste screenshots straight into the open modal */
document.addEventListener("paste", e => {
  if(!ui.editing) return;
  const it = [...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
  if(!it) return;
  const target = ui.editing.shots && ui.editing.shots.entry ? "exit" : "entry";
  addShot(target, it.getAsFile());
  toast("Screenshot added as "+target);
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if(ui.editing){ ui.editing=null; render(); } else if(ui.aiOpen){ ui.aiOpen=false; render(); } }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); act("new-trade"); }
});
window.addEventListener("hashchange", ()=>{ const r=location.hash.replace("#","")||"dashboard"; if(r!==route){ route=r; render(); } });
let rt=null;
window.addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(()=>{}, 200); });

/* cloud user listener, if a Firebase adapter is present */
function initCloud(){
  const c = Cloud();
  if(!c || !c.onUser) return;
  c.onUser(async u => {
    if(!u){ state.session={mode:"local",email:"",name:"Guest trader"}; render(); return; }
    state.session={mode:"cloud", email:u.email, name:u.displayName||u.email.split("@")[0]};
    try{ const remote = await c.load(); if(remote){ state.trades=remote.trades||state.trades; state.journals=remote.journals||state.journals; } }catch(e){}
    save(true); render();
  });
}
initCloud();
window.addEventListener("ledger-cloud-ready", initCloud);

render();

</script>
<script type="module">
/* =====================================================================
   Ledger — Firebase adapter (optional)
   ---------------------------------------------------------------------
   This module is what turns Ledger from "local device only" into a
   synced, logged-in web app. It:
     1. asks /api/config for the PUBLIC Firebase web config
        (filled from .env.local locally / Vercel env vars in production)
     2. if the config is empty, it does nothing — the app stays offline
     3. otherwise it exposes window.LEDGER_CLOUD and fires
        "ledger-cloud-ready" so app.js can attach the auth listener

   Firestore layout:  users/{uid}  ->  { trades: [...], journals: {...}, updatedAt }
   ===================================================================== */

const SDK = "https://www.gstatic.com/firebasejs/10.12.2";

async function getConfig() {
	// Allow a hardcoded override for plain static hosting (no serverless):
	if (window.LEDGER_FIREBASE_CONFIG?.apiKey) return window.LEDGER_FIREBASE_CONFIG;
	try {
		const res = await fetch("/api/config", { cache: "no-store" });
		if (!res.ok) return null;
		const cfg = await res.json();
		return cfg && cfg.apiKey ? cfg : null;
	} catch {
		return null; // opened as a local file, or no serverless runtime
	}
}

(async function boot() {
	const config = await getConfig();
	if (!config) {
		console.info("[Ledger] No Firebase config found — running in local mode.");
		return;
	}

	const [{ initializeApp }, auth, db] = await Promise.all([
		import(`${SDK}/firebase-app.js`),
		import(`${SDK}/firebase-auth.js`),
		import(`${SDK}/firebase-firestore.js`),
	]);

	const app = initializeApp(config);
	const A = auth.getAuth(app);
	const D = db.getFirestore(app);
	await auth.setPersistence(A, auth.browserLocalPersistence);

	const userDoc = () => {
		const u = A.currentUser;
		if (!u) throw new Error("Not signed in");
		return db.doc(D, "users", u.uid);
	};

	window.LEDGER_CLOUD = {
		async signIn(email, password) {
			try {
				const { user } = await auth.signInWithEmailAndPassword(A, email, password);
				return user;
			} catch (err) {
				// First time on this project? Create the account instead of failing.
				if (["auth/user-not-found", "auth/invalid-credential"].includes(err.code)) {
					const { user } = await auth.createUserWithEmailAndPassword(A, email, password);
					return user;
				}
				throw new Error(friendly(err));
			}
		},
		async signUp(email, password) {
			try {
				const { user } = await auth.createUserWithEmailAndPassword(A, email, password);
				return user;
			} catch (err) {
				throw new Error(friendly(err));
			}
		},
		signOut() {
			return auth.signOut(A);
		},
		async load() {
			const snap = await db.getDoc(userDoc());
			return snap.exists() ? snap.data() : null;
		},
		async save(state) {
			if (!A.currentUser) return;
			await db.setDoc(
				userDoc(),
				{
					trades: state.trades ?? [],
					journals: state.journals ?? {},
					settings: { ...state.settings, aiKey: "" }, // never sync the API key
					updatedAt: Date.now(),
				},
				{ merge: true },
			);
		},
		onUser(cb) {
			return auth.onAuthStateChanged(A, cb);
		},
	};

	function friendly(err) {
		const map = {
			"auth/invalid-email": "That email address doesn't look right.",
			"auth/missing-password": "Enter your password.",
			"auth/weak-password": "Use at least 6 characters for the password.",
			"auth/email-already-in-use": "That email already has an account — check the password.",
			"auth/too-many-requests": "Too many attempts. Wait a minute and try again.",
		};
		return map[err.code] || err.message || "Sign-in failed";
	}

	window.dispatchEvent(new Event("ledger-cloud-ready"));
	console.info("[Ledger] Firebase ready — sync enabled.");
})();

</script>
